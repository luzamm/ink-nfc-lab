name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build.sh/test.sh use `shasum`, which a minimal Ubuntu image lacks.
      # xz, zip and Node.js are already installed on the runner.
      - name: Install build prerequisites
        run: |
          if ! command -v shasum >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libdigest-sha-perl
          fi
          command -v shasum xz zip node
          node --version

      # ubuntu-24.04 ships build-tools 36.0.0 and platform android-36.
      # Install them only if the runner image no longer carries them.
      - name: Ensure Android SDK 36
        run: |
          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" ] || \
             [ ! -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" ]; then
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$sdkmanager" --licenses >/dev/null || true
            "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

      - name: Run offline tests
        run: bash test.sh

      - name: Build APK
        run: bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ink-nfc-lab-debug-${{ github.run_number }}
          path: build/ink-nfc-lab-debug.apk
          if-no-files-found: error
          retention-days: 14
