name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build.sh/test.sh use `shasum`, which a minimal Ubuntu image lacks.
      # xz, zip and Node.js are already installed on the runner.
      - name: Install build prerequisites
        run: |
          if ! command -v shasum >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libdigest-sha-perl
          fi
          command -v shasum xz zip node
          node --version

      # ubuntu-24.04 ships build-tools 36.0.0 and platform android-36.
      # Install them only if the runner image no longer carries them.
      - name: Ensure Android SDK 36
        run: |
          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" ] || \
             [ ! -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" ]; then
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$sdkmanager" --licenses >/dev/null || true
            "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

      - name: Run offline tests
        run: bash test.sh

      - name: Build APK
        run: bash build.sh

      # Artifacts are always delivered as a zip by GitHub, so publish the raw
      # APK as a release asset instead. The download URL stays stable.
      - name: Publish APK to ci-latest release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="build/ink-nfc-lab-debug.apk"
          notes="Built from ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view ci-latest >/dev/null 2>&1; then
            gh release upload ci-latest "$apk" --clobber
            gh release edit ci-latest --notes "$notes" --prerelease
          else
            gh release create ci-latest "$apk" \
              --title "CI debug build" \
              --notes "$notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-latest/ink-nfc-lab-debug.apk" >> "$GITHUB_STEP_SUMMARY"
